[tool.ruff]
line-length = 100
target-version = "py313"
# Migrations are generated by Alembic: they are not reformatted by hand
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
# The same line ending on every machine (Windows would otherwise mix CRLF and LF)
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the installed package as first-party
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_models: usa los pesos reales de los modelos; se salta si no están descargados"]
